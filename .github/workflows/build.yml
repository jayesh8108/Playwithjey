
name: Build PlayWithJey Video

on:
  workflow_dispatch:
    inputs:
      format:
        description: Video format
        required: true
        type: choice
        options:
          - short
          - long

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-pil

      - name: Generate video
        run: python3 generate.py --format "${{ inputs.format }}"

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: playwithjey-video
          path: output/
          
